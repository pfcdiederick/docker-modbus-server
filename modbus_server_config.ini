; ---------------------------------------------------------------------------
; Modbus TCP server configuration
; ---------------------------------------------------------------------------
; Lines starting with ; or # are comments.
; Relative paths are resolved relative to the folder of this file.

[general]
; DEBUG, INFO, WARNING, ERROR
log_level = INFO
; CSV file with the Modbus tags this server serves (see modbus_tags.csv)
tag_file = modbus_tags.csv

[modbus]
; Interface and TCP port to listen on (0.0.0.0 = all interfaces)
host = 0.0.0.0
port = 502
; Default Modbus unit / slave id (can be overridden per tag in the CSV)
unit_id = 1
; Order of the 16-bit words for 32/64-bit values:
;   big    = high word first (ABCD)
;   little = low word first  (CDAB, "swap words")
word_order = big
; Order of the bytes inside one 16-bit register:
;   big    = standard Modbus (AB)
;   little = swapped bytes   (BA)
byte_order = big
